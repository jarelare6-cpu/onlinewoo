<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0B0E14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Online">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<title>Online — لوحة الإرسال</title>
<style>
/* ═══════════════════════════════════════════════════════════════
   TOKENS
   لوحة رصد: حبر أزرق عميق + نحاس دافئ + إشارة حيّة
   القاعدة: واجهة بخط إنساني، بيانات بخط آلي. التباين مقصود.
═══════════════════════════════════════════════════════════════ */
:root {
  --ink:      #090C12;
  --slate:    #121722;
  --raised:   #1A2130;
  --raised-2: #232C3E;
  --line:     #2A3549;
  --line-soft:#1D2534;

  --brass:    #F0B45C;
  --brass-2:  #D98F3A;
  --brass-dim:#7C5A24;
  --signal:   #45E0AA;
  --signal-dim:#1B6049;
  --alert:    #FF7A7A;
  --alert-dim:#5C2727;
  --violet:   #9B8CFF;
  --azure:    #5FBDF2;

  --grad-brass: linear-gradient(135deg, #F5BE68 0%, #DB9339 100%);
  --ease: cubic-bezier(.4, 0, .2, 1);
  --shadow-1: 0 1px 2px rgba(0,0,0,.28);
  --shadow-2: 0 6px 20px -6px rgba(0,0,0,.5);

  --text:     #E6EAF2;
  --text-2:   #A8B2C4;
  --muted:    #6B7789;

  --r-sm: 8px;
  --r:    12px;
  --r-lg: 18px;

  --sans: 'IBM Plex Sans Arabic', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;

  --safe-b: env(safe-area-inset-bottom, 0px);
  --nav-h: 62px;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

html { -webkit-text-size-adjust: 100%; }

body {
  background: var(--ink);
  color: var(--text);
  font-family: var(--sans);
  font-size: 14px;
  line-height: 1.55;
  min-height: 100dvh;
  overflow-x: hidden;
}

/* radial ambience — ثابت، بلا حركة */
body::before {
  content: '';
  position: fixed; inset: 0; z-index: -1;
  background:
    radial-gradient(900px 420px at 85% -8%, rgba(229,166,75,.07), transparent 62%),
    radial-gradient(700px 380px at 8% 104%, rgba(139,124,246,.06), transparent 60%);
  pointer-events: none;
}

button, input, textarea { font-family: inherit; font-size: inherit; color: inherit; }
button { cursor: pointer; border: none; background: none; }
input:focus-visible, button:focus-visible, textarea:focus-visible {
  outline: 2px solid var(--brass); outline-offset: 2px;
}
.mono { font-family: var(--mono); font-variant-ligatures: none; }

::-webkit-scrollbar { width: 4px; height: 4px; }
::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }
::-webkit-scrollbar-track { background: transparent; }

@media (prefers-reduced-motion: reduce) {
  * { animation-duration: .01ms !important; transition-duration: .01ms !important; }
}

/* ═══════════════════════════════════════════════════════════════
   BOOT SPLASH — يظهر لحظة واحدة أثناء التحقق الصامت
═══════════════════════════════════════════════════════════════ */
#boot {
  position: fixed; inset: 0; z-index: 900;
  background: var(--ink);
  display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 14px;
  transition: opacity .3s;
}
#boot.gone { opacity: 0; pointer-events: none; }
.boot-mark {
  font-family: var(--mono); font-size: 11px; font-weight: 600;
  letter-spacing: .32em; color: var(--brass);
}
.boot-bar {
  width: 120px; height: 2px; border-radius: 2px;
  background: var(--line); overflow: hidden;
}
.boot-bar::after {
  content: ''; display: block; width: 40%; height: 100%;
  background: var(--brass); animation: slide 1s ease-in-out infinite;
}
@keyframes slide { 0% { transform: translateX(-120%); } 100% { transform: translateX(320%); } }

/* شريط خطأ داخل التطبيق — بديل شاشة الدخول */
.banner {
  display: none;
  margin: 12px 16px 0; padding: 11px 13px;
  background: var(--alert-dim); border: 1px solid var(--alert);
  border-radius: var(--r-sm); font-size: 12.5px; color: #FFC9C9;
}
.banner.show { display: block; }
.banner button {
  display: block; margin-top: 8px;
  font-size: 12px; font-weight: 600; color: var(--alert);
  text-decoration: underline;
}

.field { margin-bottom: 14px; }
.field-label {
  display: block; font-size: 11px; font-weight: 500;
  color: var(--text-2); margin-bottom: 6px; letter-spacing: .02em;
}
.input {
  width: 100%;
  background: var(--slate);
  border: 1px solid var(--line);
  border-radius: var(--r);
  padding: 12px 14px;
  color: var(--text);
  outline: none;
  transition: border-color .2s var(--ease), background .2s var(--ease), box-shadow .2s var(--ease);
}
.input::placeholder { color: var(--muted); }
.input:focus {
  border-color: var(--brass); background: var(--raised);
  box-shadow: 0 0 0 3px rgba(240,180,92,.1);
}
.input.mono { font-size: 12.5px; direction: ltr; text-align: left; }

.btn {
  width: 100%;
  padding: 13px 18px;
  border-radius: var(--r);
  font-weight: 600; font-size: 14px;
  display: flex; align-items: center; justify-content: center; gap: 8px;
  transition: transform .16s var(--ease), filter .2s var(--ease), opacity .2s var(--ease), box-shadow .2s var(--ease);
}
.btn:active { transform: scale(.978); }
.btn:disabled { opacity: .42; pointer-events: none; }
.btn-primary {
  background: var(--grad-brass); color: #171104;
  box-shadow: var(--shadow-1);
}
.btn-primary:hover { filter: brightness(1.05); box-shadow: var(--shadow-2); }
.btn-ghost { background: var(--raised); border: 1px solid var(--line); color: var(--text-2); }
.btn-danger { background: var(--alert-dim); border: 1px solid var(--alert); color: var(--alert); }

/* ═══════════════════════════════════════════════════════════════
   HEADER + STATUS RAIL (العنصر المميّز)
   شريط لا يكذب: يعرض حالة الخادم والجلسة وآخر إرسال دائماً.
═══════════════════════════════════════════════════════════════ */
.header {
  position: sticky; top: 0; z-index: 200;
  background: rgba(11,14,20,.86);
  backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--line-soft);
}
.header-top {
  display: flex; align-items: center; justify-content: space-between;
  padding: 11px 16px 9px;
}
.brand { display: flex; align-items: baseline; gap: 9px; }
.brand-name {
  font-size: 16px; font-weight: 600; letter-spacing: -.01em;
}
.brand-tag {
  font-family: var(--mono); font-size: 9.5px; font-weight: 500;
  color: var(--brass); letter-spacing: .18em;
}
.user-pill {
  display: flex; align-items: center; gap: 7px;
  background: var(--raised); border: 1px solid var(--line);
  border-radius: 999px; padding: 4px 11px 4px 5px;
  font-size: 11.5px; color: var(--text-2);
}
.user-dot {
  width: 20px; height: 20px; border-radius: 50%;
  background: var(--brass-dim); color: var(--brass);
  font-family: var(--mono); font-size: 10px; font-weight: 600;
  display: grid; place-items: center;
}

/* الشريط */
.rail {
  display: flex; align-items: stretch;
  border-top: 1px solid var(--line-soft);
  background: rgba(19,24,34,.6);
}
.rail-seg {
  flex: 1; min-width: 0;
  padding: 7px 12px;
  display: flex; align-items: center; gap: 7px;
  border-inline-start: 1px solid var(--line-soft);
}
.rail-seg:first-child { border-inline-start: none; }
.rail-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--muted); flex-shrink: 0;
  transition: background .25s, box-shadow .25s;
}
.rail-dot.ok    { background: var(--signal); box-shadow: 0 0 0 3px rgba(63,217,164,.14); }
.rail-dot.err   { background: var(--alert);  box-shadow: 0 0 0 3px rgba(255,107,107,.14); }
.rail-dot.wait  { background: var(--brass);  animation: pulse 1.1s ease-in-out infinite; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .3; } }
.rail-body { min-width: 0; }
.rail-key {
  display: block; font-family: var(--mono);
  font-size: 8.5px; letter-spacing: .14em; color: var(--muted);
}
.rail-val {
  display: block; font-family: var(--mono); font-size: 10.5px;
  color: var(--text-2); white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis;
}

/* ═══════════════════════════════════════════════════════════════
   PAGES + NAV
═══════════════════════════════════════════════════════════════ */
.page { display: none; padding-bottom: calc(var(--nav-h) + var(--safe-b) + 12px); }
.page.active { display: block; }

.nav {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 200;
  display: flex;
  background: rgba(11,14,20,.92);
  backdrop-filter: blur(14px);
  border-top: 1px solid var(--line-soft);
  padding-bottom: var(--safe-b);
}
.nav-item {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 3px;
  padding: 9px 4px 8px;
  color: var(--muted); font-size: 10px; font-weight: 500;
  position: relative; transition: color .18s;
}
.nav-item svg { width: 19px; height: 19px; }
.nav-item.active { color: var(--brass); }
.nav-item.active::before {
  content: ''; position: absolute; top: 0; left: 24%; right: 24%;
  height: 2px; background: var(--grad-brass); border-radius: 0 0 3px 3px;
}

/* ═══════════════════════════════════════════════════════════════
   SHARED BLOCKS
═══════════════════════════════════════════════════════════════ */
.section-label {
  font-family: var(--mono); font-size: 9.5px; font-weight: 500;
  letter-spacing: .2em; color: var(--muted);
  padding: 18px 16px 8px;
}
.card {
  background: var(--slate);
  border: 1px solid var(--line-soft);
  border-radius: var(--r);
}
.stack { padding: 0 16px; display: flex; flex-direction: column; gap: 9px; }

.row {
  display: flex; align-items: center; justify-content: space-between;
  gap: 12px; padding: 13px 14px;
}
.row-label { font-size: 13px; }
.row-sub { font-size: 11.5px; color: var(--muted); margin-top: 1px; }
.row .input { width: 152px; padding: 8px 10px; font-size: 12px; }

/* ═══════════════════════════════════════════════════════════════
   DEVICE IDs — داخل شاشة اللعبة، حيث تُستعمل فعلاً
═══════════════════════════════════════════════════════════════ */
.idbox {
  margin: 0 16px 12px;
  background: var(--slate); border: 1px solid var(--line-soft);
  border-radius: var(--r); overflow: hidden;
}
.idbox-head {
  padding: 9px 14px; border-bottom: 1px solid var(--line-soft);
  font-family: var(--mono); font-size: 9px; letter-spacing: .18em; color: var(--muted);
}
.idbox-body { padding: 12px 14px 4px; }
.idbox-field { margin-bottom: 10px; }
.idbox-field .input { padding: 9px 11px; font-size: 11.5px; }

/* زر اللغة */
.header-right { display: flex; align-items: center; gap: 8px; }
.lang-btn {
  font-family: var(--mono); font-size: 11px; font-weight: 600;
  letter-spacing: .06em; color: var(--brass);
  background: var(--raised); border: 1px solid var(--line);
  border-radius: 999px; padding: 5px 11px;
  transition: background .16s;
}
.lang-btn:active { background: var(--raised-2); }

/*/* ═══════════════════════════════════════════════════════════════
   SEARCH + FILTERS
═══════════════════════════════════════════════════════════════ */
.search-wrap { padding: 10px 16px 8px; }
.search-box { position: relative; }
.search-box svg {
  position: absolute; inset-inline-end: 12px; top: 50%; transform: translateY(-50%);
  width: 15px; height: 15px; color: var(--muted); pointer-events: none;
}
.search-box .input { padding-inline-end: 36px; }

.chips {
  display: flex; gap: 7px; padding: 2px 16px 10px;
  overflow-x: auto; scrollbar-width: none;
}
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex-shrink: 0; padding: 6px 13px;
  border-radius: 999px; font-size: 12px; font-weight: 500;
  background: var(--slate); border: 1px solid var(--line-soft);
  color: var(--text-2); transition: all .2s var(--ease);
}
.chip.active {
  background: var(--grad-brass); border-color: transparent; color: #171104;
  box-shadow: var(--shadow-1);
}

/* ═══════════════════════════════════════════════════════════════
   GAME LIST — قائمة لا شبكة: الحزمة نصّ آليّ يجب أن يُقرأ
═══════════════════════════════════════════════════════════════ */
.game-list { padding: 0 16px; display: flex; flex-direction: column; gap: 7px; }
.game-item {
  width: 100%; text-align: start;
  background: var(--slate); border: 1px solid var(--line-soft);
  border-radius: var(--r);
  padding: 12px 14px;
  display: flex; align-items: center; gap: 12px;
  transition: border-color .2s var(--ease), transform .16s var(--ease), background .2s var(--ease);
}
.game-item:active { transform: scale(.988); border-color: var(--brass); background: var(--raised); }
.game-idx {
  flex-shrink: 0; width: 30px; height: 30px; border-radius: var(--r-sm);
  background: var(--raised); border: 1px solid var(--line);
  display: grid; place-items: center;
  font-family: var(--mono); font-size: 10.5px; font-weight: 600;
  color: var(--brass);
}
.game-meta { flex: 1; min-width: 0; }
.game-name {
  font-size: 13.5px; font-weight: 500; line-height: 1.35;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.game-pkg {
  font-family: var(--mono); font-size: 10px; color: var(--muted);
  direction: ltr; text-align: left; margin-top: 2px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.game-cat {
  flex-shrink: 0; font-family: var(--mono); font-size: 8.5px;
  letter-spacing: .1em; color: var(--muted);
  border: 1px solid var(--line-soft); border-radius: 999px;
  padding: 2px 7px;
}

.star {
  flex-shrink: 0; width: 30px; height: 30px; border-radius: var(--r-sm);
  font-size: 15px; line-height: 1; color: var(--muted);
  display: grid; place-items: center;
  transition: color .16s, background .16s;
}
.star.on { color: var(--brass); }
.star:active { background: var(--raised-2); }

.empty {
  text-align: center; padding: 48px 24px; color: var(--muted); font-size: 13px;
}
.empty b { display: block; color: var(--text-2); font-weight: 500; margin-bottom: 4px; }

/* ═══════════════════════════════════════════════════════════════
   DETAIL
═══════════════════════════════════════════════════════════════ */
.view { display: none; }
.view.active { display: block; }

.back {
  display: flex; align-items: center; gap: 7px;
  padding: 12px 16px; color: var(--brass); font-size: 13px; font-weight: 500;
}
.back svg { width: 15px; height: 15px; }
html[dir="ltr"] .back svg { transform: scaleX(-1); }

.detail-head { padding: 4px 16px 16px; }
.detail-name { font-size: 20px; font-weight: 600; letter-spacing: -.015em; }
.detail-pkg {
  font-family: var(--mono); font-size: 11px; color: var(--muted);
  direction: ltr; text-align: left; margin-top: 3px;
}

.payload {
  margin: 0 16px 14px;
  background: var(--slate); border: 1px solid var(--line-soft);
  border-radius: var(--r); overflow: hidden;
}
.payload-head {
  padding: 9px 14px; border-bottom: 1px solid var(--line-soft);
  font-family: var(--mono); font-size: 9px; letter-spacing: .18em; color: var(--muted);
}
.payload-body { padding: 13px 14px; }
.payload-tmpl {
  font-family: var(--mono); font-size: 13px; color: var(--violet);
  direction: ltr; text-align: left; word-break: break-all;
}
.payload-out {
  margin-top: 10px; padding-top: 10px;
  border-top: 1px dashed var(--line);
  font-family: var(--mono); font-size: 13px; color: var(--signal);
  direction: ltr; text-align: left; word-break: break-all; min-height: 20px;
}
.payload-out:empty::before { content: '—'; color: var(--muted); }

.stepper { display: flex; gap: 8px; align-items: stretch; margin: 0 16px 14px; }
.stepper .input { flex: 1; text-align: center; font-family: var(--mono); font-size: 16px; }
.step-btn {
  width: 46px; border-radius: var(--r);
  background: var(--raised); border: 1px solid var(--line);
  color: var(--text-2); font-size: 18px; font-weight: 500;
  transition: background .16s;
}
.step-btn:active { background: var(--raised-2); }

.actions { display: flex; gap: 9px; padding: 0 16px 6px; }
.actions .btn { flex: 1; }

/* ═══════════════════════════════════════════════════════════════
   LOG
═══════════════════════════════════════════════════════════════ */
.log { padding: 0 16px; display: flex; flex-direction: column; gap: 6px; }
.log-row {
  display: flex; align-items: center; gap: 10px;
  background: var(--slate); border: 1px solid var(--line-soft);
  border-radius: var(--r-sm); padding: 9px 12px;
  border-inline-end: 2px solid var(--line);
}
.log-row.ok  { border-inline-end-color: var(--signal); }
.log-row.bad { border-inline-end-color: var(--alert); }
.log-time { font-family: var(--mono); font-size: 10px; color: var(--muted); flex-shrink: 0; }
.log-name {
  flex: 1; min-width: 0; font-family: var(--mono); font-size: 11px;
  direction: ltr; text-align: left;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.log-code {
  flex-shrink: 0; font-family: var(--mono); font-size: 10px; font-weight: 600;
}
.log-row.ok  .log-code { color: var(--signal); }
.log-row.bad .log-code { color: var(--alert); }

/* ═══════════════════════════════════════════════════════════════
   PYTHON
═══════════════════════════════════════════════════════════════ */
.toolbar {
  display: flex; gap: 8px; align-items: center;
  padding: 12px 16px 10px; flex-wrap: wrap;
}
.tool-btn {
  padding: 7px 13px; border-radius: var(--r-sm);
  background: var(--raised); border: 1px solid var(--line);
  color: var(--text-2); font-size: 12px; font-weight: 500;
  transition: background .16s;
}
.tool-btn:active { background: var(--raised-2); }
.tool-btn.accent { background: var(--brass); border-color: var(--brass); color: #1A1305; }
.tool-btn:disabled { opacity: .4; pointer-events: none; }

.runner-tag {
  margin-inline-start: auto;
  font-family: var(--mono); font-size: 10px; letter-spacing: .1em;
  color: var(--muted); border: 1px solid var(--line-soft);
  border-radius: 999px; padding: 3px 9px;
}

.pip { display: flex; gap: 8px; padding: 0 16px 12px; }
.pip .input { flex: 1; direction: ltr; text-align: left; font-family: var(--mono); font-size: 12px; }
.pip .tool-btn { flex-shrink: 0; }

.pkgs { display: flex; gap: 6px; flex-wrap: wrap; padding: 0 16px 12px; }
.pkg {
  display: inline-flex; align-items: center; gap: 6px;
  font-family: var(--mono); font-size: 10.5px; color: var(--signal);
  background: rgba(63,217,164,.07); border: 1px solid var(--signal-dim);
  border-radius: 999px; padding: 3px 9px;
}
.pkg button { color: var(--muted); font-size: 13px; line-height: 1; }

.editor {
  width: 100%; min-height: 210px;
  background: #080B11;
  border: 1px solid var(--line-soft);
  border-radius: var(--r);
  color: var(--text);
  font-family: var(--mono); font-size: 12.5px; line-height: 1.65;
  padding: 14px; outline: none; resize: vertical;
  direction: ltr; text-align: left; tab-size: 2;
  transition: border-color .18s;
}
.editor:focus { border-color: var(--brass); }
.editor::placeholder { color: var(--muted); }

.console {
  background: #080B11;
  border: 1px solid var(--line-soft);
  border-radius: var(--r);
  padding: 13px 14px;
  min-height: 150px; max-height: 320px; overflow-y: auto;
  font-family: var(--mono); font-size: 11.5px; line-height: 1.7;
  direction: ltr; text-align: left;
  white-space: pre-wrap; word-break: break-word;
}
.c-out  { color: #CFE7D4; }
.c-err  { color: #FFA8A8; }
.c-note { color: var(--muted); font-style: italic; }
.c-ok   { color: var(--signal); }
.c-bad  { color: var(--alert); }

/* ═══════════════════════════════════════════════════════════════
   SNIPPETS
═══════════════════════════════════════════════════════════════ */
.snip {
  width: 100%; text-align: start;
  background: var(--slate); border: 1px solid var(--line-soft);
  border-radius: var(--r); overflow: hidden;
  transition: border-color .16s;
}
.snip:active { border-color: var(--violet); }
.snip-head {
  display: flex; align-items: center; justify-content: space-between;
  gap: 10px; padding: 12px 14px 5px;
}
.snip-title { font-size: 13.5px; font-weight: 500; }
.snip-tag {
  flex-shrink: 0; font-family: var(--mono); font-size: 9px;
  letter-spacing: .1em; color: var(--violet);
  border: 1px solid rgba(139,124,246,.3); border-radius: 999px; padding: 2px 8px;
}
.snip-desc { padding: 0 14px 11px; font-size: 12px; color: var(--muted); }
.snip-code {
  background: #080B11; border-top: 1px solid var(--line-soft);
  padding: 10px 14px;
  font-family: var(--mono); font-size: 10px; line-height: 1.6;
  color: var(--muted); direction: ltr; text-align: left;
  max-height: 62px; overflow: hidden;
  -webkit-mask-image: linear-gradient(180deg, #000 55%, transparent);
          mask-image: linear-gradient(180deg, #000 55%, transparent);
}

/* ═══════════════════════════════════════════════════════════════
   DIAGNOSTICS
═══════════════════════════════════════════════════════════════ */
.diag {
  margin: 0 16px; padding: 12px 14px;
  background: #080B11; border: 1px solid var(--line-soft);
  border-radius: var(--r);
  font-family: var(--mono); font-size: 10.5px; line-height: 1.75;
  color: var(--text-2); direction: ltr; text-align: left;
  max-height: 210px; overflow-y: auto;
  white-space: pre-wrap; word-break: break-word;
}
.diag-line-err { color: var(--alert); }
.diag-line-ok  { color: var(--signal); }
.diag-line-dim { color: var(--muted); }

/* ═══════════════════════════════════════════════════════════════
   MODAL
═══════════════════════════════════════════════════════════════ */
/* ═══════════════════════════════════════════════════════════════
   SEGMENTS — مباشر / مجدول
═══════════════════════════════════════════════════════════════ */
.segs {
  display: flex; gap: 4px; margin: 0 16px 14px;
  background: var(--slate); border: 1px solid var(--line-soft);
  border-radius: var(--r); padding: 4px;
}
.seg {
  flex: 1; padding: 9px 8px; border-radius: var(--r-sm);
  font-size: 12.5px; font-weight: 500; color: var(--text-2);
  transition: all .2s var(--ease);
}
.seg.active { background: var(--raised-2); color: var(--brass); box-shadow: var(--shadow-1); }

/* ═══════════════════════════════════════════════════════════════
   SCHEDULE BUILDER
═══════════════════════════════════════════════════════════════ */
.sched-rows { display: flex; flex-direction: column; gap: 7px; }
.srow {
  display: flex; align-items: center; gap: 7px; flex-wrap: wrap;
  background: var(--slate); border: 1px solid var(--line-soft);
  border-radius: var(--r); padding: 9px 10px;
  transition: border-color .2s var(--ease), background .2s var(--ease);
}
.srow.now { border-color: var(--signal-dim); background: rgba(69,224,170,.04); }
.srow-sel {
  flex-shrink: 0; background: var(--ink);
  border: 1px solid var(--line-soft); border-radius: var(--r-sm);
  padding: 7px 8px; color: var(--text-2);
  font-size: 11.5px; outline: none;
  appearance: none; -webkit-appearance: none;
  transition: border-color .2s var(--ease);
}
.srow-sel:focus { border-color: var(--brass); }
.srow-sel.grow { flex: 1; min-width: 0; }
.srow-now {
  flex-shrink: 0; font-size: 10.5px; font-weight: 600;
  color: var(--muted); border: 1px solid var(--line);
  border-radius: 999px; padding: 5px 10px;
  transition: all .2s var(--ease);
}
.srow-now.on { color: var(--signal); border-color: var(--signal-dim); background: rgba(69,224,170,.08); }
.srow-move {
  flex-shrink: 0; width: 22px; height: 26px; border-radius: 6px;
  color: var(--muted); font-size: 11px; line-height: 1;
  display: grid; place-items: center;
  transition: all .2s var(--ease);
}
.srow-move:active { background: var(--raised-2); color: var(--brass); }
.srow-break { flex-basis: 100%; height: 0; }
.srow:focus-within { border-color: var(--brass); }
.srow-n {
  flex-shrink: 0; min-width: 30px; height: 26px; border-radius: 7px; padding: 0 5px;
  background: var(--raised); border: 1px solid var(--line);
  display: grid; place-items: center;
  font-family: var(--mono); font-size: 9.5px; font-weight: 600; color: var(--muted);
}
.srow-in {
  flex: 1; min-width: 54px; background: var(--ink);
  border: 1px solid var(--line-soft); border-radius: var(--r-sm);
  padding: 7px 9px; color: var(--text);
  font-family: var(--mono); font-size: 12px; text-align: center;
  outline: none; transition: border-color .2s var(--ease);
}
.srow-in:focus { border-color: var(--brass); }
.srow-unit {
  flex-shrink: 0; font-family: var(--mono);
  font-size: 9px; letter-spacing: .1em; color: var(--muted);
}
.srow-unit.lvl {
  color: var(--brass); border: 1px solid var(--brass-dim);
  border-radius: 5px; padding: 3px 5px; font-size: 8.5px;
}
.srow-in.hero {
  border-color: var(--brass-dim); color: var(--brass);
  font-weight: 600; font-size: 13px;
}
.srow-in.hero:focus { border-color: var(--brass); }
.srow-x {
  flex-shrink: 0; width: 26px; height: 26px; border-radius: 7px;
  color: var(--muted); font-size: 15px; line-height: 1;
  display: grid; place-items: center; transition: all .2s var(--ease);
}
.srow-x:active { background: var(--alert-dim); color: var(--alert); }
.srow-when {
  flex-basis: 100%; order: 9;
  font-family: var(--mono); font-size: 10px; color: var(--signal);
  direction: ltr; text-align: start;
  padding-inline-start: 33px; padding-top: 2px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.srow-when .dim { color: var(--muted); }
.srow-when.bad { color: var(--alert); }

.quickfill { display: flex; gap: 7px; align-items: center; }
.quickfill-key {
  flex-shrink: 0; font-family: var(--mono); font-size: 9px;
  letter-spacing: .1em; color: var(--brass);
  border: 1px solid var(--brass-dim); border-radius: 5px; padding: 5px 7px;
}
.quickfill .input { flex: 1; min-width: 0; padding: 9px 11px; font-size: 12px; }
.quickfill .tool-btn { flex-shrink: 0; }
.quickfill-hint { font-size: 11px; color: var(--muted); padding: 0 2px; }

.presets { display: flex; gap: 6px; flex-wrap: wrap; padding: 10px 16px 0; }
.preset {
  font-family: var(--mono); font-size: 10.5px;
  background: var(--slate); border: 1px dashed var(--line);
  border-radius: 999px; padding: 5px 11px; color: var(--text-2);
  transition: all .2s var(--ease);
}
.preset:active { border-style: solid; border-color: var(--brass); color: var(--brass); }

.anchor-note {
  margin: 0 16px 12px; padding: 11px 13px;
  background: rgba(95,189,242,.06); border: 1px solid rgba(95,189,242,.24);
  border-radius: var(--r-sm); font-size: 12px; color: var(--text-2);
}
.anchor-note b { color: var(--azure); font-weight: 600; }

/* ═══════════════════════════════════════════════════════════════
   JOB CARDS — الجدول المحفوظ على الخادم
═══════════════════════════════════════════════════════════════ */
.sched-group {
  background: var(--slate); border: 1px solid var(--line-soft);
  border-radius: var(--r); overflow: hidden; margin-bottom: 10px;
}
.sched-group-head {
  display: flex; align-items: center; gap: 10px;
  padding: 11px 13px; border-bottom: 1px solid var(--line-soft);
  background: rgba(26,33,48,.5);
}
.sched-group-title { flex: 1; min-width: 0; font-size: 13px; font-weight: 500; }
.sched-group-sub {
  font-family: var(--mono); font-size: 9.5px; color: var(--muted);
  margin-top: 1px; direction: ltr; text-align: start;
}
.sched-group-x {
  flex-shrink: 0; font-size: 11px; color: var(--muted);
  border: 1px solid var(--line); border-radius: 7px; padding: 4px 9px;
  transition: all .2s var(--ease);
}
.sched-group-x:active { border-color: var(--alert); color: var(--alert); }

.job {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 13px; border-top: 1px solid var(--line-soft);
}
.job:first-child { border-top: none; }
.job-state {
  flex-shrink: 0; width: 7px; height: 7px; border-radius: 50%;
  background: var(--muted);
}
.job-state.pending { background: var(--brass); box-shadow: 0 0 0 3px rgba(240,180,92,.13); }
.job-state.done    { background: var(--signal); box-shadow: 0 0 0 3px rgba(69,224,170,.13); }
.job-state.failed  { background: var(--alert);  box-shadow: 0 0 0 3px rgba(255,122,122,.13); }
.job-state.off     { background: var(--muted); }
.job-body { flex: 1; min-width: 0; }
.job-name {
  font-family: var(--mono); font-size: 11px; direction: ltr; text-align: start;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.job-when { font-size: 10.5px; color: var(--muted); margin-top: 2px; }
.job-when .cd { color: var(--brass); font-family: var(--mono); }
.job-acts { flex-shrink: 0; display: flex; gap: 5px; }
.job-btn {
  font-size: 10px; color: var(--text-2);
  border: 1px solid var(--line); border-radius: 7px; padding: 4px 8px;
  transition: all .2s var(--ease);
}
.job-btn:active { border-color: var(--brass); color: var(--brass); }
.job-btn.danger:active { border-color: var(--alert); color: var(--alert); }

/* ═══════════════════════════════════════════════════════════════
   ADMIN — إدارة المستخدمين
═══════════════════════════════════════════════════════════════ */
.user-card {
  background: var(--slate); border: 1px solid var(--line-soft);
  border-radius: var(--r); padding: 11px 13px;
  display: flex; align-items: center; gap: 11px;
}
.user-av {
  flex-shrink: 0; width: 32px; height: 32px; border-radius: 9px;
  background: var(--raised); border: 1px solid var(--line);
  display: grid; place-items: center;
  font-family: var(--mono); font-size: 12px; font-weight: 600; color: var(--brass);
}
.user-body { flex: 1; min-width: 0; }
.user-name { font-size: 13px; font-weight: 500; }
.user-sub { font-size: 10.5px; color: var(--muted); margin-top: 1px; }
.user-badge {
  flex-shrink: 0; font-family: var(--mono); font-size: 8.5px;
  letter-spacing: .1em; border-radius: 999px; padding: 2px 8px;
  border: 1px solid var(--line-soft); color: var(--muted);
}
.user-badge.admin { color: var(--brass); border-color: var(--brass-dim); }
.user-badge.off { color: var(--alert); border-color: var(--alert-dim); }

.sheet-scroll { max-height: 74vh; overflow-y: auto; }
.split { display: flex; gap: 9px; }
.split > * { flex: 1; min-width: 0; }
select.input {
  appearance: none; -webkit-appearance: none;
  background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%),
                    linear-gradient(135deg, var(--muted) 50%, transparent 50%);
  background-position: calc(100% - 18px) 50%, calc(100% - 13px) 50%;
  background-size: 5px 5px, 5px 5px;
  background-repeat: no-repeat;
  padding-inline-end: 32px;
}

.overlay {
  position: fixed; inset: 0; z-index: 500;
  background: rgba(6,8,12,.72); backdrop-filter: blur(6px);
  display: none; align-items: flex-end; justify-content: center;
}
.overlay.open { display: flex; }
.sheet {
  width: 100%; max-width: 460px;
  background: var(--slate);
  border: 1px solid var(--line);
  border-radius: var(--r-lg) var(--r-lg) 0 0;
  padding: 20px 18px calc(20px + var(--safe-b));
  animation: rise .22s cubic-bezier(.22,.9,.3,1);
}
@keyframes rise { from { transform: translateY(18px); opacity: 0; } }
.sheet-title { font-size: 16px; font-weight: 600; margin-bottom: 16px; }
.sheet-actions { display: flex; gap: 9px; margin-top: 18px; }
.sheet-actions .btn { flex: 1; }

/* ═══════════════════════════════════════════════════════════════
   TOAST
═══════════════════════════════════════════════════════════════ */
.toast {
  position: fixed; z-index: 400;
  bottom: calc(var(--nav-h) + var(--safe-b) + 12px);
  left: 14px; right: 14px;
  background: var(--raised);
  border: 1px solid var(--line);
  border-inline-end: 3px solid var(--line);
  border-radius: var(--r);
  padding: 12px 14px;
  display: flex; align-items: center; gap: 11px;
  opacity: 0; transform: translateY(14px);
  transition: opacity .22s, transform .22s;
  pointer-events: none;
}
.toast.show { opacity: 1; transform: translateY(0); }
.toast.ok   { border-inline-end-color: var(--signal); }
.toast.bad  { border-inline-end-color: var(--alert); }
.toast.wait { border-inline-end-color: var(--brass); }
.toast-body { flex: 1; min-width: 0; }
.toast-title { font-size: 13px; font-weight: 500; }
.toast-detail {
  font-size: 11.5px; color: var(--muted); margin-top: 1px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.spin {
  width: 16px; height: 16px; flex-shrink: 0; border-radius: 50%;
  border: 2px solid var(--line); border-top-color: var(--brass);
  animation: spin .65s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.toast-glyph { font-size: 16px; flex-shrink: 0; }
</style>
</head>
<body>

<!-- ═══════════ BOOT ═══════════ -->
<div id="boot">
  <div class="boot-mark">ONLINE / DISPATCH</div>
  <div class="boot-bar"></div>
</div>

<!-- ═══════════ APP ═══════════ -->
<div id="app">

  <header class="header">
    <div class="header-top">
      <div class="brand">
        <span class="brand-name">Online</span>
        <span class="brand-tag">DISPATCH</span>
      </div>
      <div class="header-right">
        <button class="lang-btn" id="lang-btn" onclick="toggleLang()" aria-label="Language">EN</button>
        <div class="user-pill">
          <span class="user-dot" id="ui-initial">—</span>
          <span id="ui-user">—</span>
        </div>
      </div>
    </div>

    <!-- الشريط: الحالة الحقيقية، دائماً -->
    <div class="rail">
      <div class="rail-seg">
        <span class="rail-dot" id="rail-srv-dot"></span>
        <span class="rail-body">
          <span class="rail-key">SERVER</span>
          <span class="rail-val" id="rail-srv-val">—</span>
        </span>
      </div>
      <div class="rail-seg">
        <span class="rail-dot" id="rail-auth-dot"></span>
        <span class="rail-body">
          <span class="rail-key">SESSION</span>
          <span class="rail-val" id="rail-auth-val">—</span>
        </span>
      </div>
      <div class="rail-seg">
        <span class="rail-dot" id="rail-last-dot"></span>
        <span class="rail-body">
          <span class="rail-key">LAST</span>
          <span class="rail-val" id="rail-last-val">—</span>
        </span>
      </div>
    </div>
  </header>

  <div class="banner" id="banner"></div>

  <!-- ───── GAMES ───── -->
  <section class="page active" id="page-games">
    <div id="view-list" class="view active">
      <div class="search-wrap">
        <div class="search-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input class="input" id="in-search" data-i18n-ph="searchPh" oninput="applyFilters()">
        </div>
      </div>

      <div class="chips" id="chips"></div>
      <div class="game-list" id="game-list"></div>
      <div class="empty" id="no-results" style="display:none">
        <b data-i18n="noResT"></b>
        <span data-i18n="noResS"></span>
      </div>
    </div>

    <div id="view-detail" class="view">
      <button class="back" onclick="showView('view-list')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg>
        <span data-i18n="backAll"></span>
      </button>

      <div class="detail-head">
        <div class="detail-name" id="d-name"></div>
        <div class="detail-pkg" id="d-pkg"></div>
      </div>

      <div class="idbox">
        <div class="idbox-head" data-i18n="deviceIds"></div>
        <div class="idbox-body">
          <div class="idbox-field">
            <label class="field-label" for="g-gaid">GAID</label>
            <input class="input mono" id="g-gaid" dir="ltr" spellcheck="false"
                   placeholder="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx" oninput="saveId('gaid','g-gaid')">
          </div>
          <div class="idbox-field">
            <label class="field-label" for="g-afid">AppsFlyer ID</label>
            <input class="input mono" id="g-afid" dir="ltr" spellcheck="false"
                   placeholder="0000000000000-0000000000000000000" oninput="saveId('afid','g-afid')">
          </div>
        </div>
      </div>

      <div class="payload">
        <div class="payload-head">EVENT TEMPLATE</div>
        <div class="payload-body">
          <div class="payload-tmpl" id="d-tmpl"></div>
          <div class="payload-out" id="d-preview"></div>
        </div>
      </div>

      <div class="stepper" id="d-stepper">
        <button class="step-btn" onclick="bumpLevel(-1)">−</button>
        <input class="input" id="in-level" type="number" min="1" inputmode="numeric" data-i18n-ph="levelPh" oninput="renderPreview()">
        <button class="step-btn" onclick="bumpLevel(1)">+</button>
      </div>

      <div class="actions">
        <button class="btn btn-primary" onclick="dispatchLevel()" data-i18n="sendEvent"></button>
        <button class="btn btn-ghost" onclick="dispatchPurchase()" data-i18n="sendPurchase"></button>
      </div>

      <div class="stack" style="margin-top:9px">
        <button class="btn btn-ghost" onclick="openBuilder()" data-i18n="scheduleThis"></button>
      </div>

      <div class="section-label" data-i18n="dispatchLog"></div>
      <div class="log" id="log"></div>
    </div>
  </section>

  <!-- ───── SCHEDULE ───── -->
  <section class="page" id="page-schedule">
    <div class="segs">
      <button class="seg active" id="seg-build" onclick="setSchedTab('build')" data-i18n="tabBuild"></button>
      <button class="seg" id="seg-active" onclick="setSchedTab('active')" data-i18n="tabActive"></button>
    </div>

    <!-- بناء جدول جديد -->
    <div id="sched-build">
      <div class="anchor-note">
        <b data-i18n="anchorTitle"></b>
        <span data-i18n="anchorBody"></span>
      </div>

      <div class="stack">
        <div>
          <label class="field-label" for="sc-game" data-i18n="pickGame"></label>
          <select class="input" id="sc-game" onchange="onSchedGameChange()"></select>
        </div>
        <div>
          <label class="field-label" for="sc-name" data-i18n="schedName"></label>
          <input class="input" id="sc-name" data-i18n-ph="schedNamePh">
        </div>
      </div>

      <div class="section-label" data-i18n="schedRows"></div>

      <div class="stack" style="margin-bottom:10px">
        <div class="quickfill">
          <span class="quickfill-key" data-i18n="lvlTag"></span>
          <input class="input mono" id="sc-levels" dir="ltr" spellcheck="false"
                 data-i18n-ph="levelsPh" onkeydown="if(event.key==='Enter')applyLevels()">
          <button class="tool-btn" onclick="applyLevels()" data-i18n="apply"></button>
        </div>
        <div class="quickfill-hint" data-i18n="levelsHint"></div>
      </div>

      <div class="stack">
        <div class="sched-rows" id="sc-rows"></div>
      </div>

      <div class="presets">
        <button class="preset" onclick="addRow()">+ <span data-i18n="addRow"></span></button>
        <button class="preset" onclick="addRow({delay:0})">⚡ <span data-i18n="addNow"></span></button>
        <button class="preset" onclick="sortRows()" data-i18n="sortRows"></button>
        <button class="preset" onclick="fillPreset([0,1,2,20,50,100])">0 · 1 · 2 · 20 · 50 · 100</button>
        <button class="preset" onclick="fillPreset([1,3,6,12,24])">1 · 3 · 6 · 12 · 24</button>
        <button class="preset" onclick="fillPreset([2,8,24,72,168])">2 · 8 · 24 · 72 · 168</button>
        <button class="preset" onclick="clearRows()" data-i18n="clearRows"></button>
      </div>

      <div class="stack" style="margin-top:16px">
        <button class="btn btn-primary" id="btn-create-sched" onclick="createSchedule()" data-i18n="createSched"></button>
      </div>
    </div>

    <!-- الجداول القائمة -->
    <div id="sched-active" style="display:none">
      <div class="toolbar">
        <button class="tool-btn" onclick="loadJobs(true)" data-i18n="refresh"></button>
        <span class="runner-tag" id="jobs-count">—</span>
      </div>
      <div class="stack" id="jobs-list"></div>
    </div>
  </section>

  <!-- ───── PYTHON ───── -->
  <section class="page" id="page-python">
    <div class="toolbar">
      <button class="tool-btn accent" id="btn-run" onclick="runCode()" data-i18n="run"></button>
      <button class="tool-btn" onclick="document.getElementById('editor').value=''" data-i18n="clearCode"></button>
      <button class="tool-btn" onclick="clearConsole()" data-i18n="clearOut"></button>
      <span class="runner-tag" id="runner-tag">RUNNER: —</span>
    </div>

    <div class="pip">
      <input class="input" id="in-pip" placeholder="numpy, pandas, requests…" dir="ltr" spellcheck="false">
      <button class="tool-btn" id="btn-pip" onclick="installPkg()" data-i18n="install"></button>
    </div>

/* ═══════════════ DIAGNOSTICS ═══════════════
   الإصلاح الجذري ٢ — لا خطأ يُبتلع. كل طلب يُسجَّل بنصّه هنا،
   ويظهر داخل التطبيق (الإعدادات) لأن الهاتف لا يملك Console.
═════════════════════════════════════════════ */
const diagLines = [];
function diag(msg, kind) {
  const t = new Date().toTimeString().slice(0, 8);
  diagLines.push({ t, msg, kind: kind || '' });
  if (diagLines.length > 120) diagLines.shift();
  renderDiag();
}
function renderDiag() {
  const el = document.getElementById('diag');
  if (!el) return;
  el.innerHTML = diagLines.map(l =>
    `<div class="diag-line-${l.kind || 'dim'}">${l.t}  ${escapeHtml(l.msg)}</div>`
  ).join('');
  el.scrollTop = el.scrollHeight;
}
function copyDiag() {
  const txt = diagLines.map(l => `${l.t}  ${l.msg}`).join('\n');
  navigator.clipboard?.writeText(txt)
    .then(() => toast('ok', '✓', t('copiedT'), t('copiedS', diagLines.length)))
    .catch(() => toast('bad', '!', t('copyFailT'), t('copyFailS')));
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}

/* ═══════════════ HTTP ═══════════════
   الإصلاح الجذري ٣ — طبقة واحدة لكل الطلبات: تُرفق الرمز،
   تفرض مهلة، تفكّ الخطأ الحقيقي، وتُميّز 401 عن انقطاع الشبكة.
═════════════════════════════════════════ */
async function api(path, opts) {
  opts = opts || {};
  const url = SERVER.replace(/\/+$/, '') + path;
  const headers = { 'Content-Type': 'application/json' };
  if (TOKEN) headers['X-Token'] = TOKEN;

  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), opts.timeout || REQ_TIMEOUT);

  try {
    const res = await fetch(url, {
      method: opts.method || 'GET',
      headers,
      body: opts.body ? JSON.stringify(opts.body) : undefined,
      signal: ctrl.signal
    });

    let data = null;
    const text = await res.text();
    try { data = text ? JSON.parse(text) : null; } catch (_) { data = { raw: text }; }

    if (!res.ok) {
      const detail = (data && (data.error || data.message)) || ('HTTP ' + res.status);
      diag(`${opts.method || 'GET'} ${path} → ${res.status} ${detail}`, 'err');
      const err = new Error(detail);
      err.status = res.status;
      err.data = data;
      throw err;
    }

    diag(`${opts.method || 'GET'} ${path} → ${res.status}`, 'ok');
    return data;

  } catch (e) {
    if (e.status) throw e;
    // تمييز سبب الفشل بدل "Failed to fetch" المبهم
    let reason;
    if (e.name === 'AbortError') reason = t('errTimeout', (opts.timeout || REQ_TIMEOUT) / 1000);
    else if (e instanceof TypeError) reason = t('errNet');
    else reason = e.message || t('errUnknown');
    diag(`${opts.method || 'GET'} ${path} ✗ ${reason}`, 'err');
    const err = new Error(reason);
    err.network = true;
    throw err;
  } finally {
    clearTimeout(timer);
  }
}

function rail(seg, state, val) {
  const dot = document.getElementById('rail-' + seg + '-dot');
  const box = document.getElementById('rail-' + seg + '-val');
  if (dot) dot.className = 'rail-dot' + (state ? ' ' + state : '');
  if (box && val !== undefined) box.textContent = val;
}

/* ═══════════════ SERVER CHECK ═══════════════ */
async function checkServer(loud) {
  rail('srv', 'wait', t('railChecking'));
  try {
    const r = await api('/health', { timeout: 20000 });
    serverUp = true;
    const ok = r && r.ok !== false;
    rail('srv', ok ? 'ok' : 'err', ok ? t('railConnected') : t('railDbDown'));
    if (loud) toast(ok ? 'ok' : 'bad', ok ? '✓' : '!', ok ? t('srvOkT') : t('srvDbT'),
                    (r && r.detail) || '');
    return ok;
  } catch (e) {
    // /health قد لا يكون منشوراً بعد — نجرّب الجذر
    try {
      await api('/', { timeout: 20000 });
      serverUp = true;
      rail('srv', 'ok', t('railConnected'));
      if (loud) toast('ok', '✓', t('srvOkT'), t('srvNoHealth'));
      return true;
    } catch (e2) {
      serverUp = false;
      rail('srv', 'err', t('railUnavailable'));
      if (loud) toast('bad', '✗', t('srvDownT'), e2.message);
      return false;
    }
  }
}

/* ═══════════════ AUTH — صامتة تماماً ═══════════════
   الخادم يفرض المصادقة على /api/send-event و /run و /pip،
   فلا يمكن إلغاؤها من هنا. لكنها لا تحتاج شاشة: البيانات
   مكتوبة أعلاه، والتطبيق يدخل وحده عند الفتح ويجدّد الرمز
   تلقائياً إن انتهت الجلسة. لا حقول، ولا أزرار، ولا انتظار.
═══════════════════════════════════════════════════════ */
async function signIn() {
  const r = await api('/auth/login', {
    method: 'POST',
    body: { username: CREDS.username, password: CREDS.password }
  });
  TOKEN = r.token;
  ME = r;
  localStorage.setItem(K.token, TOKEN);
  return r;
}

async function resume() {
  hideBanner();
  const up = await checkServer(false);
  if (!up) {
    showApp();
    banner(t('bnrServerDown'), t('actRetry'));
    return;
  }

  try {
    // رمز محفوظ؟ تحقّق منه. وإلا سجّل الدخول مباشرة.
    if (TOKEN) {
      try { ME = await api('/auth/me'); }
      catch (e) { if (e.status === 401) { TOKEN = ''; localStorage.removeItem(K.token); ME = await signIn(); } else throw e; }
    } else {
      ME = await signIn();
    }
    ready();
  } catch (e) {
    showApp();
    rail('auth', 'err', t('railAuthFail'));
    banner(e.status === 401 ? t('bnrBadCreds') : t('bnrLoginFail') + e.message, t('actRetry'));
  }
}

function showApp() {
  const b = document.getElementById('boot');
  b.classList.add('gone');
  setTimeout(() => { b.style.display = 'none'; }, 320);
}

function ready() {
  showApp();
  hideBanner();
  refreshAccount();
  rail('auth', 'ok', ME.username || '—');
  document.getElementById('set-server').value = SERVER;
  diag(t('sessionReady') + ME.username, 'ok');
  boot();
}

function refreshAccount() {
  if (!ME) return;
  document.getElementById('ui-user').textContent = ME.username || '—';
  document.getElementById('ui-initial').textContent = (ME.username || '?')[0].toUpperCase();
  document.getElementById('ui-role').textContent = ME.role === 'admin' ? t('roleAdmin') : t('roleUser');
  document.getElementById('ui-quota').textContent =
    ME.role === 'admin' ? t('quotaUnlimited') : t('quotaFmt', ME.uses_left, ME.max_uses);
}

function banner(msg, actionLabel) {
  const el = document.getElementById('banner');
  el.innerHTML = escapeHtml(msg) +
    (actionLabel ? `<button onclick="retry()">${escapeHtml(actionLabel)}</button>` : '');
  el.classList.add('show');
}
function hideBanner() { document.getElementById('banner').classList.remove('show'); }

function retry() {
  hideBanner();
  document.getElementById('boot').style.display = 'flex';
  document.getElementById('boot').classList.remove('gone');
  resume();
}

/* انتهاء الجلسة أثناء الاستخدام: يُجدَّد الرمز صامتاً ويُعاد الطلب مرة واحدة */
async function guard401(e) {
  if (e.status !== 401) return false;
  diag(t('sessionRenew'), 'dim');
  try {
    await signIn();
    rail('auth', 'ok', ME.username);
    toast('ok', '✓', t('sessionRenewedT'), t('sessionRenewedS'));
  } catch (_) {
    rail('auth', 'err', t('railAuthFail'));
    banner(t('bnrRenewFail'), t('actRetry'));
  }
  return true;
}

  if (id === 'all') return GAMES.length;
  if (id === 'fav') return favs.length;
  return GAMES.filter(g => g.cat === id).length;
}

function renderChips() {
  document.getElementById('chips').innerHTML = CATS.map(c => {
    const label = c.key ? t(c.key) : c.label;
    const star = c.id === 'fav' ? '★ ' : '';
    return `<button class="chip${c.id === activeCat ? ' active' : ''}" onclick="setCat('${c.id}')">${star}${label} ${countCat(c.id)}</button>`;
  }).join('');
}
function setCat(id) { activeCat = id; renderChips(); applyFilters(); }

function applyFilters() {
  const q = document.getElementById('in-search').value.trim().toLowerCase();
  let list = GAMES;
  if (activeCat === 'fav') list = list.filter(g => isFav(g.package));
  else if (activeCat !== 'all') list = list.filter(g => g.cat === activeCat);
  if (q) list = list.filter(g => g.name.toLowerCase().includes(q) || g.package.toLowerCase().includes(q));

  // المفضّلة أولاً دائماً
  list = list.slice().sort((a, b) => (isFav(b.package) ? 1 : 0) - (isFav(a.package) ? 1 : 0));

  const empty = document.getElementById('no-results');
  empty.style.display = list.length ? 'none' : 'block';
  if (!list.length) {
    const fav = activeCat === 'fav' && !q;
    empty.innerHTML = `<b>${t(fav ? 'noFavT' : 'noResT')}</b><span>${t(fav ? 'noFavS' : 'noResS')}</span>`;
  }

  document.getElementById('game-list').innerHTML = list.map(g => {
    const i = GAMES.indexOf(g);
    const on = isFav(g.package);
    return `<div class="game-item" onclick="openGame(${i})">
      <span class="game-idx">${String(i + 1).padStart(2, '0')}</span>
      <span class="game-meta">
        <span class="game-name">${escapeHtml(g.name)}</span>
        <span class="game-pkg">${escapeHtml(g.package)}</span>
      </span>
      <span class="game-cat">${g.cat.toUpperCase()}</span>
      <button class="star${on ? ' on' : ''}" onclick="toggleFav('${g.package}', event)" aria-label="star">${on ? '★' : '☆'}</button>
    </div>`;
  }).join('');
}

function openGame(i) {
  activeGame = GAMES[i];
  const hasNum = activeGame.tmpl.includes('{}');
  document.getElementById('d-name').textContent = activeGame.name;
  document.getElementById('d-pkg').textContent = activeGame.package;
  document.getElementById('d-tmpl').textContent = activeGame.tmpl;
  document.getElementById('d-stepper').style.display = hasNum ? 'flex' : 'none';
  // يتذكّر آخر مستوى استُعمل مع هذه اللعبة تحديداً
  const remembered = JSON.parse(localStorage.getItem('ol_levels') || '{}')[activeGame.package];
  document.getElementById('in-level').value = hasNum ? (remembered || '1') : '';

  eventLog = [];
  renderLog();

}

function bumpLevel(d) {

function rememberLevel() {

/* ═══════════════ DISPATCH ═══════════════ */
async function dispatchLevel() {
  const tm = activeGame.tmpl, v = document.getElementById('in-level').value;
  if (tm.includes('{}') && !v) return toast('bad', '!', t('needLevelT'), t('needLevelS'));
  await dispatch('level', tm.includes('{}') ? tm.replace('{}', v) : tm);
}
async function dispatchPurchase() { await dispatch('purchase', 'af_purchase'); }

async function dispatch(kind, evName) {
  if (!activeGame) return;
  rail('last', 'wait', t('railSending'));
  toast('wait', null, t('sendingT'), evName);

  const body = {
    appsflyer_id: afid,
    advertising_id: gaid,
    eventName: evName,
    eventTime: new Date().toISOString(),
    eventValue: kind === 'purchase'
      ? JSON.stringify({ af_revenue: '4.99', af_currency: 'USD' })
      : '{}'
  };

  try {
    const r = await api('/api/send-event', {
      method: 'POST',
      body: { package: activeGame.package, dev_key: activeGame.dev_key, body }
    });
    const code = r.status_code;
    const ok = code >= 200 && code < 300;
    addLog(evName, String(code), ok);
    rail('last', ok ? 'ok' : 'err', evName.slice(0, 18));
    toast(ok ? 'ok' : 'bad', ok ? '✓' : '✗',
          ok ? t('sentT') : t('rejectedT'), `${evName} · ${code}`);
  } catch (e) {
    if (await guard401(e)) return;
    addLog(evName, e.status ? String(e.status) : 'NET', false);
    rail('last', 'err', t('railFailed'));
    toast('bad', '✗', t('notSentT'), e.message);
  }
}

function addLog(name, code, ok) {
  const d = new Date();
  const t = [d.getHours(), d.getMinutes(), d.getSeconds()]
    .map(n => String(n).padStart(2, '0')).join(':');
  eventLog.unshift({ name, code, ok, t });
  renderLog();
}

function renderLog() {
  const el = document.getElementById('log');
  if (!eventLog.length) {
    el.innerHTML = `<div class="empty"><b>${t('noLogT')}</b>${t('noLogS')}</div>`;
    return;
  }
  el.innerHTML = eventLog.map(e => `
    <div class="log-row ${e.ok ? 'ok' : 'bad'}">
      <span class="log-time">${e.t}</span>
      <span class="log-name">${escapeHtml(e.name)}</span>
      <span class="log-code">${escapeHtml(e.code)}</span>
    </div>`).join('');
}

function cwrite(text, cls) {
  const el = document.getElementById('console');
  const s = document.createElement('span');
  s.className = 'c-' + (cls || 'out');
  s.textContent = text;
  el.appendChild(s);
  el.scrollTop = el.scrollHeight;
}

let runnerKey = 'runnerLoading';
function setRunner(key) {
  runnerKey = key || runnerKey;
  document.getElementById('runner-tag').textContent = 'RUNNER: ' + t(runnerKey);
}

async function runCode() {
  const code = document.getElementById('editor').value.trim();
  if (!code) return toast('bad', '!', t('emptyEditorT'), t('emptyEditorS'));
  clearConsole();

  if (serverUp && TOKEN) {
    cwrite(t('runRemote') + '\n', 'note');
    const btn = document.getElementById('btn-run');
    btn.disabled = true;
    const t0 = Date.now();
    try {
      const r = await api('/run', { method: 'POST', body: { code }, timeout: 40000 });
      if (r.stdout) cwrite(r.stdout, 'out');
      if (r.stderr) cwrite(r.stderr, 'err');
      const s = ((Date.now() - t0) / 1000).toFixed(2);
      cwrite(r.returncode === 0 ? t('runDoneFmt', s) : t('runFailed'),
             r.returncode === 0 ? 'ok' : 'bad');
    } catch (e) {
      if (await guard401(e)) return;
      cwrite('// ' + e.message + '\n', 'bad');
    } finally { btn.disabled = false; }
    return;
  }

  if (!pyReady) return toast('bad', '⏳', t('pyNotReadyT'), t('pyNotReadyS'));
  cwrite(t('runLocal') + '\n', 'note');
  try {
    const out = await pyodide.runPythonAsync(code);
    if (out !== undefined && out !== null) cwrite(String(out) + '\n', 'out');
    cwrite(t('runDone'), 'ok');
  } catch (e) {
    cwrite(e.message + '\n', 'err');
  }
}

async function installPkg() {
  const pkg = document.getElementById('in-pip').value.trim().toLowerCase();
  if (!pkg) return;
  const btn = document.getElementById('btn-pip');
  btn.disabled = true;
  toast('wait', null, 'pip install ' + pkg, t('pipWaitS'));

  try {
    if (serverUp && TOKEN) {
      const r = await api('/pip', { method: 'POST', body: { package: pkg }, timeout: 70000 });
      if (!r.success) throw new Error(r.message || t('pipFailT'));
    } else {
      if (!pyReady) throw new Error(t('pyNotReadyT'));
      await pyodide.runPythonAsync(`import micropip\nawait micropip.install('${pkg}')`);
    }
    if (!pkgs.includes(pkg)) { pkgs.push(pkg); localStorage.setItem(K.pkgs, JSON.stringify(pkgs)); }
    renderPkgs();
    document.getElementById('in-pip').value = '';
    toast('ok', '✓', t('pipOkT'), pkg);
    cwrite('// installed: ' + pkg + '\n', 'ok');
  } catch (e) {
    if (await guard401(e)) return;
    toast('bad', '✗', t('pipFailT'), e.message);
    cwrite('// ' + e.message + '\n', 'bad');
  } finally { btn.disabled = false; }
}

function handleTab(e) {
  if (e.key !== 'Tab') return;
  e.preventDefault();
  const ta = e.target, s = ta.selectionStart, en = ta.selectionEnd;
  ta.value = ta.value.slice(0, s) + '  ' + ta.value.slice(en);
  ta.selectionStart = ta.selectionEnd = s + 2;
}

  setRunner('runnerLoading');

}

/* ═══════════════════════════════════════════════════════════════
   SCHEDULING — الإرسال الآلي
   ───────────────────────────────────────────────────────────────
   القرار الهندسي: الجدولة تعيش على الخادم لا في المتصفح.
   مؤقّت في الصفحة يموت لحظة إغلاق التبويب أو قفل الهاتف، وحدث
   بعد 100 ساعة لن يصل أبداً. الخادم عنده Celery + scheduled_jobs
   أصلاً، فنستعمله: كل صف في الجدول يصير مهمة مستقلّة بموعدها.

   ولماذا مهمة لكل حدث بدل مهمة واحدة بعدة أحداث؟ لأن الجدول
   الواحد له run_at واحد على الخادم — فلا يمكنه تفريق الأحداث على
   ساعات مختلفة. الفصل يعطي أيضاً تعديلاً وحذفاً لكل حدث وحده.

   المرساة: لحظة الضغط على "إنشاء الجدول". كل الساعات تُضاف إليها.
═══════════════════════════════════════════════════════════════ */

/* نموذج الصف:
   { kind: 'level'|'purchase'|'custom', level, custom, delay, unit }
   delay = 0  ⇒  يُرسل فوراً عند إنشاء الجدول.
   unit: 'm' دقيقة | 'h' ساعة | 'd' يوم — لأن "بعد 90 دقيقة" و
   "بعد 3 أيام" أوضح من كسور الساعات. */
let schedRows = [];
let jobsCache = [];
let cdTimer = null;
let editingJob = null;

const UNIT_MS = { m: 60000, h: 3600000, d: 86400000 };

/* الخادم يخزّن TIMESTAMPTZ والحاوية تعمل بتوقيت UTC،
   فنرسل UTC صريحاً ونعرض التوقيت المحلي دائماً. */
function toServerTime(d) {
  const z = n => String(n).padStart(2, '0');
  return `${d.getUTCFullYear()}-${z(d.getUTCMonth() + 1)}-${z(d.getUTCDate())} ` +
         `${z(d.getUTCHours())}:${z(d.getUTCMinutes())}:${z(d.getUTCSeconds())}`;
}
function fmtLocal(d) {
  return d.toLocaleString(LANG === 'ar' ? 'ar' : 'en-GB',
    { weekday: 'short', day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
}
function countdown(target) {
  const ms = target - Date.now();
  if (ms <= 0) return t('duePast');
  const m = Math.floor(ms / 60000), h = Math.floor(m / 60), d = Math.floor(h / 24);
  return t('inFmt', d, h % 24, m % 60);
}
function rowMs(r) { return Math.max(0, Number(r.delay) || 0) * UNIT_MS[r.unit || 'h']; }

function rowEventName(r, g) {

/* ── الصفوف ── */
function addRow(opts) {
  const n = schedRows.length;
  schedRows.push(Object.assign(
    { kind: 'level', level: n + 1, custom: '', delay: n === 0 ? 0 : n, unit: 'h' },
    opts || {}));
  renderRows();
}
function clearRows() { schedRows = []; renderRows(); }
function dropRow(i) { schedRows.splice(i, 1); renderRows(); }
function dupRow(i) {
  schedRows.splice(i + 1, 0, Object.assign({}, schedRows[i]));
  renderRows();
}
function moveRow(i, d) {
  const j = i + d;
  if (j < 0 || j >= schedRows.length) return;
  [schedRows[i], schedRows[j]] = [schedRows[j], schedRows[i]];
  renderRows();
}
function setRow(i, field, val) {
  schedRows[i][field] = (field === 'kind' || field === 'unit' || field === 'custom')
    ? val : (val === '' ? '' : Number(val));
  renderRows();
}
function setNow(i) {
  schedRows[i].delay = 0;
  renderRows();
}
/* تعبئة أرقام المستويات دفعةً واحدة.
   يقبل:  3,7,12       → مستويات فقط، تُطبَّق على الصفوف بالترتيب
          3@0 7@2h 12@20h → مستوى مع مهلته (m/h/d، الافتراضي ساعة)
   وينشئ الصفوف الناقصة تلقائياً. */
function applyLevels() {
  const raw = document.getElementById('sc-levels').value.trim();
  if (!raw) return toast('bad', '!', t('levelsEmptyT'), t('levelsHint'));

  const parts = raw.split(/[,\s]+/).filter(Boolean);
  const parsed = [];
  for (const p of parts) {
    const m = /^(\d+)(?:@(\d+)([mhd])?)?$/i.exec(p);
    if (!m) return toast('bad', '!', t('levelsBadT'), p);
    parsed.push({
      level: parseInt(m[1], 10),
      delay: m[2] !== undefined ? parseInt(m[2], 10) : null,
      unit: (m[3] || 'h').toLowerCase()
    });
  }

  parsed.forEach((p, i) => {
    if (!schedRows[i]) schedRows[i] = { kind: 'level', level: 1, custom: '', delay: i, unit: 'h' };
    const r = schedRows[i];
    r.kind = 'level';
    r.level = p.level;
    if (p.delay !== null) { r.delay = p.delay; r.unit = p.unit; }
  });
  // إن كانت الصفوف أكثر من الأرقام، احذف الزائد
  if (schedRows.length > parsed.length) schedRows.length = parsed.length;

  renderRows();
  document.getElementById('sc-levels').value = '';
  toast('ok', '✓', t('levelsAppliedT'), t('jobsCount', parsed.length));
}

function sortRows() {
  schedRows.sort((a, b) => rowMs(a) - rowMs(b));
  renderRows();
  toast('ok', '✓', t('sortedT'), '');
}
/* القوالب تضبط المهل فقط، وتحافظ على أرقام المستويات التي أدخلتها */
function fillPreset(hoursArr) {
  schedRows = hoursArr.map((h, i) => {
    const old = schedRows[i];
    return {
      kind: old ? old.kind : 'level',
      level: old ? old.level : i + 1,
      custom: old ? old.custom : '',
      delay: h, unit: 'h'
    };
  });
  renderRows();
}

function renderRows() {
  const box = document.getElementById('sc-rows');
  if (!box) return;
  const g = schedGame();
  const now = Date.now();

  if (!schedRows.length) {
    box.innerHTML = `<div class="empty" style="padding:28px 16px"><b>${t('noRowsT')}</b><span>${t('noRowsS')}</span></div>`;
    return;
  }

  const hasLvl = g && g.tmpl.includes('{}');

  box.innerHTML = schedRows.map((r, i) => {
    const isNow = Number(r.delay) === 0;
    const ev = rowEventName(r, g);
    const when = isNow ? t('rowNow') : fmtLocal(new Date(now + rowMs(r)));
    const bad = !ev;

    // حقل وسط الصف يتبدّل حسب نوع الحدث
    let mid = '';
    if (r.kind === 'level' && hasLvl) {
      mid = `<span class="srow-unit lvl">${t('lvlTag')}</span>
             <input class="srow-in hero" type="number" min="1" inputmode="numeric" value="${r.level}"
               onchange="setRow(${i},'level',this.value)" aria-label="${t('colLevel')}">`;
    } else if (r.kind === 'custom') {
      mid = `<input class="srow-in" style="text-align:start;direction:ltr" value="${escapeHtml(r.custom)}"
               placeholder="event_name" onchange="setRow(${i},'custom',this.value)" aria-label="${t('kCustom')}">`;
    }

    return `<div class="srow${isNow ? ' now' : ''}">
      <span class="srow-n">#${i + 1}</span>

      <select class="srow-sel${mid ? '' : ' grow'}" onchange="setRow(${i},'kind',this.value)">
        <option value="level"    ${r.kind === 'level' ? 'selected' : ''}>${t('kLevel')}</option>
        <option value="purchase" ${r.kind === 'purchase' ? 'selected' : ''}>${t('kPurchase')}</option>
        <option value="custom"   ${r.kind === 'custom' ? 'selected' : ''}>${t('kCustom')}</option>
      </select>
      ${mid}

      <button class="srow-move" onclick="moveRow(${i},-1)" aria-label="up">▲</button>
      <button class="srow-move" onclick="moveRow(${i},1)" aria-label="down">▼</button>
      <button class="srow-move" onclick="dupRow(${i})" aria-label="duplicate">⧉</button>
      <button class="srow-x" onclick="dropRow(${i})" aria-label="remove">×</button>

      <span class="srow-break"></span>

      <button class="srow-now${isNow ? ' on' : ''}" onclick="setNow(${i})">${t('rowNow')}</button>
      <input class="srow-in" type="number" min="0" step="1" inputmode="numeric" value="${r.delay}"
             onchange="setRow(${i},'delay',this.value)" aria-label="${t('colDelay')}">
      <select class="srow-sel" onchange="setRow(${i},'unit',this.value)">
        <option value="m" ${r.unit === 'm' ? 'selected' : ''}>${t('uMin')}</option>
        <option value="h" ${r.unit === 'h' ? 'selected' : ''}>${t('uHour')}</option>
        <option value="d" ${r.unit === 'd' ? 'selected' : ''}>${t('uDay')}</option>
      </select>

      <span class="srow-when">${bad ? `<span class="dim">${t('rowNoName')}</span>`
        : `${escapeHtml(ev)} <span class="dim">·</span> ${when}`}</span>
    </div>`;
  }).join('');
}

/* ── الإنشاء ── */
async function createSchedule() {
  const g = schedGame();
  if (!g) return toast('bad', '!', t('needGameT'), '');
  if (!schedRows.length) return toast('bad', '!', t('needRowsT'), '');
  if (schedRows.some(r => !rowEventName(r, g))) return toast('bad', '!', t('badRowT'), t('rowNoName'));
  if (!gaid.trim() || !afid.trim()) return toast('bad', '!', t('needIdsT'), t('needIdsS'));

  const btn = document.getElementById('btn-create-sched');
  btn.disabled = true;
  toast('wait', null, t('createSched'), g.name);

  const sid = Math.random().toString(36).slice(2, 7).toUpperCase();
  const label = (document.getElementById('sc-name').value.trim() || g.name).slice(0, 40);
  const anchorMs = Date.now();          // ← المرساة: هذه اللحظة بالضبط

  // بالترتيب الزمني حتى يكون سجل الخادم مقروءاً
  const ordered = schedRows.slice().sort((a, b) => rowMs(a) - rowMs(b));

  let done = 0, fired = 0;
  for (const r of ordered) {
    const ev = rowEventName(r, g);
    const ms = rowMs(r);
    const tag = ms === 0 ? 'now' : `+${r.delay}${r.unit}`;
    try {
      const res = await api('/jobs', {
        method: 'POST',
        body: {
          name: `[S:${sid}] ${label} · ${tag}`,
          events: [{ name: ev }],
          run_at: toServerTime(new Date(anchorMs + ms)),
          package: g.package,
          dev_key: g.dev_key,
          gaid: gaid.trim(),
          afid: afid.trim(),
          os: 'android'
        }
      });
      done++;
      // "الآن" لا ينتظر دورة الجدولة التالية — يُدفع للتنفيذ فوراً
      if (ms === 0 && res && res.id) {
        try { await api(`/jobs/${res.id}/run`, { method: 'POST' }); fired++; }
        catch (e2) { diag(`immediate run failed for #${res.id}: ${e2.message}`, 'err'); }
      }
    } catch (e) {
      if (await guard401(e)) { btn.disabled = false; return; }
      diag(`schedule row ${tag} failed: ${e.message}`, 'err');
    }
  }

  btn.disabled = false;
  if (done === ordered.length) {
    toast('ok', '✓', t('schedCreatedT'),
          t('schedCreatedS', done) + (fired ? ' · ' + t('firedNow', fired) : ''));
    schedRows = []; renderRows();
    document.getElementById('sc-name').value = '';
    setSchedTab('active');
  } else if (done > 0) {
    toast('bad', '!', t('schedPartialT'), t('schedPartialS', done, ordered.length));
    setSchedTab('active');
  } else {
    toast('bad', '✗', t('schedFailT'), '');
  }
}

/* من داخل شاشة اللعبة */
function openBuilder() {
  switchPage('schedule');
  setSchedTab('build');
  if (activeGame) {
    const i = GAMES.indexOf(activeGame);
    if (i >= 0) document.getElementById('sc-game').value = String(i);
  }
  if (!schedRows.length) fillPreset([1, 2, 20, 50, 100]);
  else renderRows();
}

/* ── الجداول القائمة ── */
async function loadJobs(loud) {
  const box = document.getElementById('jobs-list');
  try {
    jobsCache = await api('/jobs');
    renderJobs();
    if (loud) toast('ok', '✓', t('refresh'), t('jobsCount', jobsCache.length));
  } catch (e) {
    if (await guard401(e)) return;
    box.innerHTML = `<div class="empty"><b>${t('noJobsT')}</b><span>${escapeHtml(t('jobsLoadFail') + e.message)}</span></div>`;
  }
}

function jobState(j) {
  if (!j.enabled) return 'off';
  if (!j.last_run) return 'pending';
  return /ok|success|20[01]|sent/i.test(String(j.last_status || '')) ? 'done' : 'failed';
}

function renderJobs() {
  const box = document.getElementById('jobs-list');
  document.getElementById('jobs-count').textContent = t('jobsCount', jobsCache.length);

  if (!jobsCache.length) {
    box.innerHTML = `<div class="empty"><b>${t('noJobsT')}</b><span>${t('noJobsS')}</span></div>`;
    return;
  }

  // تجميع حسب وسم الجدول المضمّن في الاسم
  const groups = {};
  jobsCache.forEach(j => {
    const m = /^\[S:([A-Z0-9]+)\]\s*(.*?)\s*·\s*\+/.exec(j.name || '');
    const key = m ? m[1] : '_';
    (groups[key] = groups[key] || { label: m ? m[2] : t('otherGroup'), jobs: [] }).jobs.push(j);
  });

  box.innerHTML = Object.entries(groups).map(([key, g]) => {
    const jobs = g.jobs.slice().sort((a, b) => new Date(a.run_at) - new Date(b.run_at));
    const pkg = jobs[0].package || '';
    return `<div class="sched-group">
      <div class="sched-group-head">
        <div style="flex:1;min-width:0">
          <div class="sched-group-title">${escapeHtml(g.label)}</div>
          <div class="sched-group-sub">${escapeHtml(pkg)} · ${jobs.length}</div>
        </div>
        ${key !== '_' ? `<button class="sched-group-x" onclick="delGroup('${key}')">${t('jDel')}</button>` : ''}
      </div>
      ${jobs.map(j => {
        const st = jobState(j);
        const when = new Date(j.run_at);
        const ev = (Array.isArray(j.events) && j.events[0] && j.events[0].name) || j.name;
        const tail = st === 'pending'
          ? `${fmtLocal(when)} · <span class="cd">${countdown(when)}</span>`
          : `${fmtLocal(when)} · ${t('st' + st[0].toUpperCase() + st.slice(1))}`;
        return `<div class="job">
          <span class="job-state ${st}"></span>
          <span class="job-body">
            <span class="job-name">${escapeHtml(ev)}</span>
            <span class="job-when">${tail}</span>
          </span>
          <span class="job-acts">
            <button class="job-btn" onclick="runJobNow(${j.id})">${t('jRun')}</button>
            <button class="job-btn" onclick="toggleJob(${j.id})">${j.enabled ? t('jPause') : t('jResume')}</button>
            <button class="job-btn" onclick="openJobSheet(${j.id})">${t('jEdit')}</button>
            <button class="job-btn danger" onclick="delJob(${j.id})">${t('jDel')}</button>
          </span>
        </div>`;
      }).join('')}
    </div>`;
  }).join('');
}

async function runJobNow(id) {
  try {
    await api(`/jobs/${id}/run`, { method: 'POST' });
    toast('ok', '✓', t('queuedT'), '#' + id);
    setTimeout(() => loadJobs(false), 1500);
  } catch (e) { if (!await guard401(e)) toast('bad', '✗', t('notSentT'), e.message); }
}

function openJobSheet(id) {
  const j = jobsCache.find(x => x.id === id);
  if (!j) return;
  editingJob = j;
  const ev = (Array.isArray(j.events) && j.events[0] && j.events[0].name) || j.name;
  const mins = Math.round((new Date(j.run_at) - Date.now()) / 60000);

  document.getElementById('js-title').textContent = ev;
  // نختار الوحدة الأنسب تلقائياً حتى لا يرى المستخدم 4320 دقيقة
  let d = Math.max(0, mins), u = 'm';
  if (d >= 1440 && d % 1440 === 0) { d = d / 1440; u = 'd'; }
  else if (d >= 60) { d = Math.round(d / 60); u = 'h'; }
  document.getElementById('js-delay').value = d;
  document.getElementById('js-unit').value = u;
  document.getElementById('js-enabled').value = j.enabled ? '1' : '0';
  document.getElementById('js-when').textContent = fmtLocal(new Date(j.run_at));
  syncSelectLabels();
  previewJobTime();
  document.getElementById('job-sheet').classList.add('open');
}
function closeJobSheet() { document.getElementById('job-sheet').classList.remove('open'); }

function previewJobTime() {
  const d = Number(document.getElementById('js-delay').value) || 0;
  const u = document.getElementById('js-unit').value;
  const el = document.getElementById('js-preview');
  el.textContent = d === 0 ? t('rowNow') : fmtLocal(new Date(Date.now() + d * UNIT_MS[u]));
}

async function saveJob() {
  if (!editingJob) return;
  const d = Number(document.getElementById('js-delay').value) || 0;
  const u = document.getElementById('js-unit').value;
  const en = parseInt(document.getElementById('js-enabled').value, 10);
  const btn = document.getElementById('js-save');
  btn.disabled = true;
  try {
    await api(`/jobs/${editingJob.id}`, {
      method: 'PUT',
      body: { run_at: toServerTime(new Date(Date.now() + d * UNIT_MS[u])), enabled: en }
    });
    toast('ok', '✓', t('userSavedT'), '#' + editingJob.id);
    closeJobSheet();
    loadJobs(false);
  } catch (e) {
    if (!await guard401(e)) toast('bad', '✗', t('schedFailT'), e.message);
  } finally { btn.disabled = false; }
}

async function toggleJob(id) {
  const j = jobsCache.find(x => x.id === id);
  if (!j) return;
  try {
    await api(`/jobs/${id}`, { method: 'PUT', body: { enabled: j.enabled ? 0 : 1 } });
    toast('ok', '✓', j.enabled ? t('stOff') : t('stPending'), '#' + id);
    loadJobs(false);
  } catch (e) { if (!await guard401(e)) toast('bad', '✗', t('schedFailT'), e.message); }
}

async function delJob(id) {
  if (!confirm(t('delJobQ'))) return;
  try {
    await api(`/jobs/${id}`, { method: 'DELETE' });
    toast('ok', '✓', t('deletedT'), '#' + id);
    loadJobs(false);
  } catch (e) { if (!await guard401(e)) toast('bad', '✗', t('schedFailT'), e.message); }
}

async function delGroup(key) {
  const ids = jobsCache.filter(j => (j.name || '').startsWith(`[S:${key}]`)).map(j => j.id);
  if (!ids.length || !confirm(t('delGroupQ', ids.length))) return;
  let n = 0;
  for (const id of ids) {
    try { await api(`/jobs/${id}`, { method: 'DELETE' }); n++; }
    catch (e) { if (await guard401(e)) return; }
  }
  toast('ok', '✓', t('deletedT'), t('jobsCount', n));
  loadJobs(false);
}

/* العدّاد الحيّ: إعادة رسم كل 30 ثانية بينما الصفحة ظاهرة فقط،
   وإعادة جلب من الخادم كل 5 دقائق لالتقاط ما نُفّذ فعلاً. */
function startCountdowns() {
  clearInterval(cdTimer);
  let ticks = 0;
  cdTimer = setInterval(() => {
    const page = document.getElementById('page-schedule');
    const box = document.getElementById('sched-active');
    if (!page || !page.classList.contains('active')) return;
    if (!box || box.style.display === 'none') return;
    if (++ticks % 10 === 0) loadJobs(false);   // كل 5 دقائق
    else if (jobsCache.length) renderJobs();
  }, 30000);
}

/* ═══════════════════════════════════════════════════════════════
   ADMIN — إدارة المستخدمين
═══════════════════════════════════════════════════════════════ */
let usersCache = [];
let editingUser = null;

function isAdmin() { return ME && ME.role === 'admin'; }

async function loadUsers() {
  if (!isAdmin()) return;
  document.getElementById('admin-block').style.display = 'block';
  try {
    usersCache = await api('/admin/users');
    renderUsers();
  } catch (e) {
    if (await guard401(e)) return;
    document.getElementById('users-list').innerHTML =
      `<div class="empty"><span>${escapeHtml(t('usersFail') + e.message)}</span></div>`;
  }
}

function renderUsers() {
  document.getElementById('users-list').innerHTML = usersCache.map(u => `
    <div class="user-card" onclick="openUserSheet(${u.id})">
      <span class="user-av">${escapeHtml((u.username || '?')[0].toUpperCase())}</span>
      <span class="user-body">
        <span class="user-name">${escapeHtml(u.username)}</span>
        <span class="user-sub">${t('quotaCell', u.uses_left, u.max_uses)}</span>
      </span>
      ${!u.active ? `<span class="user-badge off">${t('optOff').toUpperCase()}</span>` : ''}
      <span class="user-badge${u.role === 'admin' ? ' admin' : ''}">${(u.role === 'admin' ? t('optAdmin') : t('optUser')).toUpperCase()}</span>
    </div>`).join('');
}

function openUserSheet(id) {
  editingUser = id != null ? usersCache.find(u => u.id === id) : null;
  const nu = !editingUser;
  document.getElementById('us-title').textContent = t(nu ? 'newUserT' : 'editUserT');
  document.getElementById('us-name').value = nu ? '' : editingUser.username;
  document.getElementById('us-name').disabled = !nu;
  document.getElementById('us-pass').value = '';
  document.getElementById('us-pass').placeholder = nu ? '' : t('passHint');
  document.getElementById('us-role').value = nu ? 'user' : editingUser.role;
  document.getElementById('us-quota').value = nu ? 100 : editingUser.max_uses;
  document.getElementById('us-active-wrap').style.display = nu ? 'none' : 'block';
  document.getElementById('us-active').value = nu ? '1' : String(editingUser.active ? 1 : 0);
  document.getElementById('us-save').textContent = t('save');
  const del = document.getElementById('us-del');
  del.style.display = nu ? 'none' : 'block';
  del.onclick = nu ? null : () => delUser(editingUser.id);
  syncSelectLabels();
  document.getElementById('user-sheet').classList.add('open');
}
function closeUserSheet() { document.getElementById('user-sheet').classList.remove('open'); }

function syncSelectLabels() {
  const r = document.getElementById('us-role');
  if (r) { r.options[0].textContent = t('optUser'); r.options[1].textContent = t('optAdmin'); }
  const a = document.getElementById('us-active');
  if (a) { a.options[0].textContent = t('optActive'); a.options[1].textContent = t('optOff'); }
  const je = document.getElementById('js-enabled');
  if (je) { je.options[0].textContent = t('optActive'); je.options[1].textContent = t('optOff'); }
  const ju = document.getElementById('js-unit');
  if (ju) { ju.options[0].textContent = t('uMin'); ju.options[1].textContent = t('uHour'); ju.options[2].textContent = t('uDay'); }
}

async function saveUser() {
  const name = document.getElementById('us-name').value.trim();
  const pass = document.getElementById('us-pass').value;
  const role = document.getElementById('us-role').value;
  const quota = parseInt(document.getElementById('us-quota').value, 10) || 0;
  const btn = document.getElementById('us-save');

  if (!editingUser) {
    if (!name || !pass) return toast('bad', '!', t('needUserT'), t('needUserS'));
    if (pass.length < 8) return toast('bad', '!', t('shortPassT'), t('shortPassS'));
  } else if (pass && pass.length < 8) {
    return toast('bad', '!', t('shortPassT'), t('shortPassS'));
  }

  btn.disabled = true;
  try {
    if (!editingUser) {
      await api('/admin/users', {
        method: 'POST',
        body: { username: name, password: pass, role, max_uses: quota }
      });
      toast('ok', '✓', t('userAddedT'), name);
    } else {
      const body = {
        role, max_uses: quota, uses_left: quota,
        active: parseInt(document.getElementById('us-active').value, 10)
      };
      if (pass) body.password = pass;
      await api(`/admin/users/${editingUser.id}`, { method: 'PUT', body });
      toast('ok', '✓', t('userSavedT'), editingUser.username);
    }
    closeUserSheet();
    loadUsers();
  } catch (e) {
    if (!await guard401(e)) toast('bad', '✗', t('needUserT'), e.message);
  } finally { btn.disabled = false; }
}

async function delUser(id) {
  const u = usersCache.find(x => x.id === id);
  if (!u || !confirm(t('delUserQ', u.username))) return;
  try {
    await api(`/admin/users/${id}`, { method: 'DELETE' });
    toast('ok', '✓', t('userDelT'), u.username);
    closeUserSheet();
    loadUsers();
  } catch (e) { if (!await guard401(e)) toast('bad', '✗', t('userDelT'), e.message); }
}

document.getElementById('user-sheet').addEventListener('click', function (e) {
  if (e.target === this) closeUserSheet();
});
document.getElementById('job-sheet').addEventListener('click', function (e) {
  if (e.target === this) closeJobSheet();
});

/* ═══════════════ TOAST ═══════════════ */
function toast(kind, glyph, title, detail) {
  const el = document.getElementById('toast');
  el.className = 'toast ' + kind;
  document.getElementById('toast-glyph').innerHTML =
    kind === 'wait' ? '<div class="spin"></div>' : (glyph || '');
  document.getElementById('toast-title').textContent = title || '';
  document.getElementById('toast-detail').textContent = detail || '';
  el.classList.add('show');
  clearTimeout(toastTimer);
  if (kind !== 'wait') toastTimer = setTimeout(() => el.classList.remove('show'), 3200);
}

/* ═══════════════ MISC ═══════════════ */
function wipe() {
  if (!confirm(t('wipeConfirm'))) return;
  localStorage.clear();
  location.reload();
}

/* ═══════════════ BOOT ═══════════════ */
function boot() {
  applyLang();
  renderSchedGames();
  renderRows();
  loadJobs(false);
  loadUsers();
  startCountdowns();
  renderChips();
  applyFilters();
  renderIds();
  renderPkgs();
  renderSnips();
  renderDiag();
  loadPyodide_();
  // فحص دوري: يُبقي الشريط صادقاً ويُنبّه فور سقوط الخادم
  setInterval(() => { if (TOKEN) checkServer(false); }, 120000);
}

document.getElementById('set-server').addEventListener('change', function () {
  SERVER = this.value.trim().replace(/\/+$/, '');
  localStorage.setItem(K.server, SERVER);
  checkServer(true);
});

applyLang();
diag(t('bootDiag') + SERVER);
resume();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
